name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate docs
        run: make -C backend docs

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: backend
          args: --build-tags=integration ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate docs
        run: make -C backend docs

      - name: Run unit tests
        run: make -C backend test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate docs
        run: make -C backend docs

      - name: Run integration tests
        run: make -C backend test-integration

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate docs
        run: make -C backend docs

      - name: Run govulncheck
        run: make -C backend vuln

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, vuln]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate docs
        run: make -C backend docs

      - name: Build binary
        run: make -C backend build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minimart
          path: backend/minimart

  pgo:
    name: PGO Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate docs
        run: make -C backend docs

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: minimart
          path: backend/

      - name: Start dependencies
        run: |
          cd backend
          docker compose up -d
          sleep 10

      - name: Generate PGO profile
        run: |
          cd backend
          chmod +x minimart
          make pgo-profile

      - name: Build with PGO
        run: |
          cd backend
          make build

      - name: Upload PGO binary
        uses: actions/upload-artifact@v4
        with:
          name: minimart-pgo
          path: backend/minimart

  modernize:
    name: Modernization Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate docs
        run: make -C backend docs

      - name: Run modernization check
        run: make -C backend modernize