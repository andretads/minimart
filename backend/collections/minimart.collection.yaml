            when the payment does not exist, 409 when the payment is not
            refundable or its order is not cancelled, 502 when the payment
            provider fails the refund.
        url: "{{ _.base_url }}/v1/payments/{{ _.payment_id }}/refund"
        method: POST
        headers:
          - name: Accept
