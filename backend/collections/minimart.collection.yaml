      - name: List Showcase Product Reviews
        meta:
          id: req_list_showcase_product_reviews
          sortKey: -3800000000005
          description: |
            Lists the approved reviews of a showcase product, newest first.
            Responds 200 with a `data` array (possibly empty).
            No authentication required. Uses showcase_product_id seeded by Get Showcase Product.
        url: "{{ _.base_url }}/v1/showcase/products/{{ _.showcase_product_id }}/reviews"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list showcase product reviews returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
              body.data.forEach((review) => {
                insomnia.expect(review.status).to.eql('approved');
