  - name: Notification
    meta:
      id: fld_notification
      sortKey: -2000000000000
      description: |
        Read-only view over user notifications plus the authenticated user's
        notification preferences. Notifications are written by the Kafka worker
        from business events (not by the HTTP API), so results appear
        asynchronously after placing an order and require the worker to be
        running (make worker). Preferences are self-service and derive the user
        from the access-token cookie; a disabled category makes the worker skip
        that notification entirely.
