      - name: Delete Category
        meta:
          id: req_delete_category
          sortKey: -3900000000008
          description: |
            Deletes a category by id with exact If-Match version. Responds 204.
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
