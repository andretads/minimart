type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: MiniMart API
meta:
  id: wrk_minimart
  description: |
    Insomnia collection for the MiniMart HTTP API (auth, catalog, cart, order,
    payment, shipping, customer, notification, showcase).

    All endpoints live under /v1. Auth endpoints handle signup, login, token refresh, and current user info.
    Base URL defaults to http://localhost:8080 (server SERVER_HTTP_ADDR default).

    The requests form a happy-path flow and share state through environment
    variables set by after-response scripts (product_id, product_version,
    product_etag, cart_id, cart_order_id, shipping_method_id,
    shipping_quote_id, shipment_id, order_id, payment_id, customer_id,
    notification_id). Run requests top-to-bottom within each folder, or use the
    Collection Runner for the whole flow.

    Note: notifications are produced asynchronously by the Kafka worker from
    OrderPlaced events, so the Notification requests may return empty results
    until a worker has processed an order.

    Note: the cart endpoints are unauthenticated and identify the caller by the
    user_id query parameter, so they need no Authorization header.
collection:
  - name: Auth
    meta:
      id: fld_auth
      sortKey: -4500000000000
      description: |
        Authentication and authorization endpoints. SignUp creates an account
        and provisions a customer record. Login issues access and refresh JWTs
        as HttpOnly cookies. Refresh uses the refresh token cookie to renew both
        cookies (sliding session). Me returns the current user's info using the
        access token cookie. Logout clears both cookies and is safe to call
        without a valid access token. All endpoints use cookies for authentication.
    children:
      - name: Sign Up
        meta:
          id: req_signup
          sortKey: -4500000000001
          description: |
            Creates a new user account. Responds 201 with the account in `data`
            (id, username, created_at). 409 when username already exists.
        url: "{{ _.base_url }}/v1/auth/signup"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "username": "testuser",
              "password": "password123"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('sign up returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string').that.has.lengthOf(26).and.match(/^[A-Z2-7]+$/);
              insomnia.expect(body.data.username).to.eql('testuser');
            });
      - name: Login
        meta:
          id: req_login
          sortKey: -4500000000002
          description: |
            Authenticates a user and sets access (mm_at) and refresh (mm_rt)
            tokens as HttpOnly cookies. Set `remember_me` to true to receive the
            longer refresh-token lifetime. Responds 200 with the user and the
            access-token expiry in `data` (id, username, email, created_at,
            access_token_expires_at, expires_in). 401 for invalid credentials.
        url: "{{ _.base_url }}/v1/auth/login"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "username": "testuser",
              "password": "password123"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('login returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string');
              insomnia.expect(body.data.username).to.eql('testuser');
              insomnia.expect(body.data.access_token_expires_at).to.be.a('string');
              insomnia.expect(body.data.expires_in).to.be.a('number');
            });
      - name: Refresh Token
        meta:
          id: req_refresh
          sortKey: -4500000000003
          description: |
            Uses the refresh token cookie (mm_rt) to renew both the access
            (mm_at) and refresh (mm_rt) cookies. Responds 200 with
            { "status": "refreshed", "access_token_expires_at", "expires_in" }.
            401 when the refresh token is invalid or expired.
        url: "{{ _.base_url }}/v1/auth/refresh"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: "{}"
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('refresh returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.status).to.eql('refreshed');
              insomnia.expect(body.data.access_token_expires_at).to.be.a('string');
              insomnia.expect(body.data.expires_in).to.be.a('number');
            });
      - name: Get Current User
        meta:
          id: req_me
          sortKey: -4500000000004
          description: |
            Returns the current authenticated user's information using the
            access token cookie (mm_at). Responds 200 with the user and the
            access-token expiry in `data` (id, username, email, created_at,
            access_token_expires_at, expires_in). 401 when unauthenticated.
        url: "{{ _.base_url }}/v1/auth/me"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('me returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string');
              insomnia.expect(body.data.username).to.eql('testuser');
              insomnia.expect(body.data.access_token_expires_at).to.be.a('string');
              insomnia.expect(body.data.expires_in).to.be.a('number');
            });
      - name: Change Password
        meta:
          id: req_change_password
          sortKey: -4500000000005
          description: |
            Changes the authenticated user's password. Requires the access token
            cookie (mm_at) and the current password. The new password must match
            its confirmation. Responds 200 with { "status": "password_changed" }.

            Note: this mutates the account password. After running it, update the
            Login request to use the new password before running the collection
            again.
        url: "{{ _.base_url }}/v1/auth/change-password"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "current_password": "password123",
              "new_password": "password456",
              "confirm_new_password": "password456"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('change password returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.status).to.eql('password_changed');
            });
      - name: Logout
        meta:
          id: req_logout
          sortKey: -4500000000006
          description: |
            Clears the access (mm_at) and refresh (mm_rt) cookies. Logout is
            public, so it succeeds even when the access token has expired.
            Responds 200 with { "status": "logged_out" }.
        url: "{{ _.base_url }}/v1/auth/logout"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: "{}"
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('logout returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.status).to.eql('logged_out');
            });
  - name: Catalog
    meta:
      id: fld_catalog
      sortKey: -4000000000000
      description: |
        Product management with optimistic locking (ETag / If-Match / If-None-Match).
        Run requests in order: Create Product seeds product_id, product_version
        and product_etag used by the later requests.
    children:
      - name: Create Product
        meta:
          id: req_create_product
          sortKey: -4000000000001
          description: |
            Creates a product. Responds 201 with the product in `data` and an
            `ETag` header (the product version, e.g. "1"). Product images are
            added separately through the product image endpoints.
            Seeds product_id, product_version and product_etag.
        url: "{{ _.base_url }}/v1/products"
        method: POST
        headers:
          - name: Content-Type
            value: multipart/form-data
        parameters:
          - name: name
            value: "Gizmo"
          - name: price_cents
            value: "100"
          - name: stock
            value: "10"
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('create product returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string').that.has.lengthOf(26).and.match(/^[A-Z2-7]+$/);
              insomnia.expect(body.data.name).to.eql('Gizmo');
              insomnia.expect(body.data.price_cents).to.eql(100);
              insomnia.expect(body.data.stock).to.eql(10);
              insomnia.expect(body.data.version).to.eql(1);
            });
            if (insomnia.response.status === 201) {
              const headers = insomnia.response.headers || {};
              insomnia.environment.set('product_id', body.data.id);
              insomnia.environment.set('product_version', body.data.version);
              insomnia.environment.set('product_etag', headers.etag || headers.ETag || '');
            }
      - name: List Products
        meta:
          id: req_list_products
          sortKey: -4000000000002
          description: |
            Lists the entire catalog (no pagination). Responds 200 with an array
            in `data` (empty array when there are no products).
        url: "{{ _.base_url }}/v1/products"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list products returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
              body.data.forEach(product => {
                insomnia.expect(product.images).to.be.an('array');
                product.images.forEach(image => {
                  insomnia.expect(image.url).to.be.a('string');
                });
              });
            });
      - name: Get Product
        meta:
          id: req_get_product
          sortKey: -4000000000003
          description: |
            Fetches a product by id. Responds 200 with the product in `data` and
            a fresh `ETag` header. 404 when the product does not exist.
            Refreshes product_etag.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get product returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.eql(insomnia.environment.get('product_id'));
              insomnia.expect(body.data.images).to.be.an('array');
              body.data.images.forEach(image => {
                insomnia.expect(image.url).to.be.a('string');
              });
            });
            if (insomnia.response.status === 200) {
              const headers = insomnia.response.headers || {};
              insomnia.environment.set('product_etag', headers.etag || headers.ETag || '');
            }
      - name: Get Product (If-None-Match)
        meta:
          id: req_get_product_inm
          sortKey: -4000000000004
          description: |
            Conditional GET with the ETag from a previous response. Responds
            304 Not Modified (empty body) when the ETag still matches.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}"
        method: GET
        headers:
          - name: If-None-Match
            value: '{{ _.product_etag }}'
        scripts:
          afterResponse: |-
            insomnia.test('conditional get returns 304', () => {
              insomnia.expect(insomnia.response.status).to.eql(304);
            });
      - name: Add Product Image
        meta:
          id: req_add_product_image
          sortKey: -40000000000045
          description: |
            Uploads an image and appends it to the product. Responds 201 with the
            image in `data`. Adding an image bumps the product version.
            Seeds product_image_id.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}/images"
        method: POST
        headers:
          - name: Content-Type
            value: multipart/form-data
        parameters:
          - name: image
            value: ""
            fileName: "product.jpg"
            type: file
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('add product image returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.product_id).to.eql(insomnia.environment.get('product_id'));
              insomnia.expect(body.data.url).to.be.a('string');
            });
            if (insomnia.response.status === 201) {
              insomnia.environment.set('product_image_id', body.data.id);
            }
      - name: List Product Images
        meta:
          id: req_list_product_images
          sortKey: -40000000000046
          description: |
            Lists a product's images ordered by position. The first image is the
            primary image. Responds 200 with an array in `data`.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}/images"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list product images returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
            });
      - name: Delete Product Image
        meta:
          id: req_delete_product_image
          sortKey: -40000000000047
          description: |
            Removes an image from a product. Responds 204 with an empty body.
            Deleting an image bumps the product version.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}/images/{{ _.product_image_id }}"
        method: DELETE
        scripts:
          afterResponse: |-
            insomnia.test('delete product image returns 204', () => {
              insomnia.expect(insomnia.response.status).to.eql(204);
            });
      - name: Update Product (If-Match)
        meta:
          id: req_update_product_if_match
          sortKey: -4000000000005
          description: |
            Partial update using optimistic locking via the If-Match header (the
            recommended way; overrides any version in the body). Responds 200 with
            the updated product and a new ETag. 409 when the ETag is stale.
            Stock is preserved server-side and cannot be changed here.
            Product images are managed through the dedicated image endpoints.
            Refreshes product_version and product_etag.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: multipart/form-data
          - name: If-Match
            value: '{{ _.product_etag }}'
        parameters:
          - name: name
            value: "Gizmo Mk II"
          - name: price_cents
            value: "150"
          - name: version
            value: '{{ _.product_version }}'
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('update product via If-Match returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.name).to.eql('Gizmo Mk II');
              insomnia.expect(body.data.price_cents).to.eql(150);
            });
            if (insomnia.response.status === 200) {
              const headers = insomnia.response.headers || {};
              insomnia.environment.set('product_version', body.data.version);
              insomnia.environment.set('product_etag', headers.etag || headers.ETag || '');
            }
      - name: Update Product (version in body)
        meta:
          id: req_update_product_body_version
          sortKey: -4000000000006
          description: |
            Alternative optimistic locking: send the current version in the body
            instead of the If-Match header. Responds 200 with the updated product.
            409 when the version is stale.
            Refreshes product_version.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Gizmo Mk III",
              "price_cents": 175,
              "version":{{ _.product_version }}
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('update product via body version returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.name).to.eql('Gizmo Mk III');
              insomnia.expect(body.data.version).to.eql(insomnia.environment.get('product_version') + 1);
            });
            if (insomnia.response.status === 200) {
              insomnia.environment.set('product_version', body.data.version);
            }
      - name: Update Product (stale ETag, 409)
        meta:
          id: req_update_product_conflict
          sortKey: -4000000000007
          description: |
            Demonstrates a lock conflict: sends a stale If-Match value and
            expects 409 "conflito de bloqueio do produto".
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
          - name: If-Match
            value: '"99"'
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Gizmo Stale",
              "price_cents": 999
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('stale If-Match returns 409', () => {
              insomnia.expect(insomnia.response.status).to.eql(409);
              insomnia.expect(body.error.message).to.eql('conflito de bloqueio do produto');
            });
      - name: Add Product Review
        meta:
          id: req_add_product_review
          sortKey: -4000000000008
          description: |
            Adds a review for a product. Requires authentication (access token cookie)
            and the `reviews:write` permission, which the customer and admin roles
            hold. The review is attributed to the signed in customer, so no customer
            id is sent in the body. Reviews start as pending for moderation.
            Responds 201 with the review in `data`.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}/reviews"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "description": "Great product!",
              "rating": 5
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('add product review returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string');
              insomnia.expect(body.data.product_id).to.eql(insomnia.environment.get('product_id'));
              insomnia.expect(body.data.customer_id).to.be.a('string');
              insomnia.expect(body.data.description).to.eql('Great product!');
              insomnia.expect(body.data.rating).to.eql(5);
              insomnia.expect(body.data.status).to.eql('pending');
            });
      - name: List Product Reviews
        meta:
          id: req_list_product_reviews
          sortKey: -4000000000009
          description: |
            Lists the approved reviews of a product. Requires authentication
            (access token cookie) and the `catalog:read` permission, which the
            customer, support and admin roles hold. Responds 200 with a `data`
            array (possibly empty). The public read path is the showcase
            reviews endpoint.
        url: "{{ _.base_url }}/v1/products/{{ _.product_id }}/reviews"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list product reviews returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
              body.data.forEach((review) => {
                insomnia.expect(review.status).to.eql('approved');
                insomnia.expect(review.rating).to.be.a('number');
                insomnia.expect(review.created_at).to.be.a('string');
              });
            });
  - name: Category
    meta:
      id: fld_category
      sortKey: -3900000000000
      description: |
        Category management with optimistic locking (ETag / If-Match / If-None-Match).
        Run requests in order: Create Category seeds category_id, category_version
        and category_etag used by the later requests.
    children:
      - name: Create Category
        meta:
          id: req_create_category
          sortKey: -3900000000001
          description: |
            Creates a category. Responds 201 with the category in `data` and an
            `ETag` header (the category version, e.g. "1").
            Seeds category_id, category_version and category_etag.
        url: "{{ _.base_url }}/v1/categories"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Electronics",
              "icon": "📱"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('create category returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string').that.has.lengthOf(26).and.match(/^[A-Z2-7]+$/);
              insomnia.expect(body.data.name).to.eql('Electronics');
              insomnia.expect(body.data.icon).to.eql('📱');
              insomnia.expect(body.data.version).to.eql(1);
            });
            if (insomnia.response.status === 201) {
              const headers = insomnia.response.headers || {};
              insomnia.environment.set('category_id', body.data.id);
              insomnia.environment.set('category_version', body.data.version);
              insomnia.environment.set('category_etag', headers.etag || headers.ETag || '');
            }
      - name: List Categories
        meta:
          id: req_list_categories
          sortKey: -3900000000002
          description: |
            Lists all categories (no pagination). Responds 200 with an array
            in `data` (empty array when there are no categories).
        url: "{{ _.base_url }}/v1/categories"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list categories returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
            });
      - name: Get Category
        meta:
          id: req_get_category
          sortKey: -3900000000003
          description: |
            Fetches a category by id. Responds 200 with the category in `data` and
            a fresh `ETag` header. 404 when the category does not exist.
            Refreshes category_etag.
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get category returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.eql(insomnia.environment.get('category_id'));
            });
            if (insomnia.response.status === 200) {
              const headers = insomnia.response.headers || {};
              insomnia.environment.set('category_etag', headers.etag || headers.ETag || '');
            }
      - name: Get Category (If-None-Match)
        meta:
          id: req_get_category_inm
          sortKey: -3900000000004
          description: |
            Fetches a category by id with If-None-Match header. Returns 304
            when the category is unchanged.
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
        method: GET
        headers:
          - name: Accept
            value: application/json
          - name: If-None-Match
            value: "{{ _.category_etag }}"
        scripts:
          afterResponse: |-
            insomnia.test('get category with If-None-Match returns 304', () => {
              insomnia.expect(insomnia.response.status).to.eql(304);
            });
      - name: Update Category (If-Match header)
        meta:
          id: req_update_category_if_match
          sortKey: -3900000000005
          description: |
            Updates a category's name and icon using If-Match header for optimistic locking.
            Responds 200 with the updated category. 409 when the version is stale.
            Refreshes category_version and category_etag.
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
          - name: If-Match
            value: "{{ _.category_etag }}"
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Electronics & Gadgets",
              "icon": "🔌"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('update category via If-Match returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.name).to.eql('Electronics & Gadgets');
              insomnia.expect(body.data.icon).to.eql('🔌');
            });
            if (insomnia.response.status === 200) {
              const headers = insomnia.response.headers || {};
              insomnia.environment.set('category_version', body.data.version);
              insomnia.environment.set('category_etag', headers.etag || headers.ETag || '');
            }
      - name: Update Category (version in body)
        meta:
          id: req_update_category_body_version
          sortKey: -3900000000006
          description: |
            Alternative optimistic locking: send the current version in the body
            instead of the If-Match header. Responds 200 with the updated category.
            409 when the version is stale.
            Refreshes category_version.
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Electronics & Accessories",
              "icon": "🎧",
              "version": {{ _.category_version }}
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('update category via body version returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.name).to.eql('Electronics & Accessories');
              insomnia.expect(body.data.version).to.eql(insomnia.environment.get('category_version') + 1);
            });
            if (insomnia.response.status === 200) {
              insomnia.environment.set('category_version', body.data.version);
            }
      - name: Update Category (stale If-Match, 409)
        meta:
          id: req_update_category_conflict
          sortKey: -3900000000007
          description: |
            Demonstrates a lock conflict: sends a stale If-Match value and
            expects 409 "category lock conflict".
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
          - name: If-Match
