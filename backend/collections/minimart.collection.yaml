      - name: Update Notification Preferences
        meta:
          id: req_update_notification_preferences
          sortKey: -2000000000004
          description: |
            Replaces all four switches for the authenticated user. All fields
            are required (400 when any is missing). Responds 200 with the saved
            preferences. The body below restores the defaults.
        url: "{{ _.base_url }}/v1/notifications/preferences"
        method: PUT
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "order_updates": true,
              "promotions": true,
              "security_alerts": true,
              "newsletter": false
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('update notification preferences returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.order_updates).to.eql(true);
              insomnia.expect(body.data.newsletter).to.eql(false);
              insomnia.expect(body.data.updated_at).to.be.a('string');
            });
  - name: Avatar
    meta:
      id: fld_avatar
      sortKey: -1500000000000
      description: |
        Account avatar upload and retrieval. Upload is multipart/form-data with
        an `image` field. The account ID in the path must match the authenticated
        user. The GET endpoint returns a presigned S3 URL for the image.
    children:
      - name: Get Avatar
        meta:
          id: req_get_avatar
          sortKey: -1500000000001
          description: |
            Fetches the avatar for an account. Responds 200 with the avatar
            metadata and a presigned `image_url`. 404 when no avatar exists.
        url: "{{ _.base_url }}/v1/avatars/{{ _.user_id }}"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get avatar returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.account_id).to.be.a('string');
              insomnia.expect(body.data.image_url).to.be.a('string');
            });
      - name: Upload Avatar
        meta:
          id: req_upload_avatar
          sortKey: -1500000000002
          description: |
            Uploads or replaces the avatar for the authenticated account. The
            `image` field must be a valid image (jpeg, png, webp, gif) under
            5MB. The path account_id must match the authenticated user.
            Responds 200 with the avatar metadata and presigned `image_url`.
            401 without auth, 403 when account_id doesn't match auth, 400 for
            missing or invalid image, 500 for storage errors.
        url: "{{ _.base_url }}/v1/avatars/{{ _.user_id }}"
        method: PUT
        headers:
          - name: Content-Type
            value: multipart/form-data
        parameters:
          - name: image
            value: ""
            fileName: "avatar.jpg"
            type: file
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('upload avatar returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.account_id).to.be.a('string');
              insomnia.expect(body.data.image_url).to.be.a('string');
            });

