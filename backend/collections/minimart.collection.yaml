            });
  - name: Showcase
    meta:
      id: fld_showcase
      sortKey: -3800000000000
      description: |
        Public product display with pagination. No authentication required.
        Run requests in order: List Showcase Products (paginated), Get Showcase Product.
    children:
      - name: List Showcase Products
        meta:
          id: req_list_showcase_products
          sortKey: -3800000000001
          description: |
            Lists all products in the showcase, newest first, with keyset pagination.
            Responds 200 with `data` array and `meta` object (page_size, next_cursor, has_more).
            No authentication required.
        url: "{{ _.base_url }}/v1/showcase/products"
        method: GET
        headers:
          - name: Accept
            value: application/json
        parameters:
          - name: page_size
            value: "20"
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list showcase products returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
              insomnia.expect(body.meta).to.be.an('object');
              insomnia.expect(body.meta.page_size).to.eql(20);
              insomnia.expect(body.meta.has_more).to.be.a('boolean');
              insomnia.expect(body.data.every((p) => typeof p.stock === 'number')).to.eql(true);
              insomnia.expect(body.data.every((p) => typeof p.total_rating === 'number')).to.eql(true);
              insomnia.expect(body.data.every((p) => typeof p.total_reviews === 'number')).to.eql(true);
            });
            if (body.meta && body.meta.next_cursor) {
              insomnia.environment.set('showcase_cursor', body.meta.next_cursor);
            }
      - name: List Showcase Products (next page)
        meta:
          id: req_list_showcase_products_p2
          sortKey: -3800000000002
          description: |
            Lists the next page of showcase products using the cursor from the previous request.
        url: "{{ _.base_url }}/v1/showcase/products"
        method: GET
        headers:
          - name: Accept
            value: application/json
        parameters:
          - name: page_size
            value: "2"
          - name: cursor
            value: "{{ _.showcase_cursor }}"
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list showcase products next page returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
              insomnia.expect(body.meta.page_size).to.eql(2);
            });
      - name: Get Showcase Product
        meta:
          id: req_get_showcase_product
          sortKey: -3800000000003
          description: |
            Fetches a showcase product by id. Responds 200 with the product in `data`.
            404 when the product does not exist.
            No authentication required. Seeds showcase_product_id.
        url: "{{ _.base_url }}/v1/showcase/products/{{ _.showcase_product_id }}"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get showcase product returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string').that.has.lengthOf(26).and.match(/^[A-Z2-7]+$/);
              insomnia.expect(body.data.name).to.be.a('string');
              insomnia.expect(body.data.price_cents).to.be.a('number');
              insomnia.expect(body.data.stock).to.be.a('number');
              insomnia.expect(body.data.total_rating).to.be.a('number');
              insomnia.expect(body.data.total_reviews).to.be.a('number');
