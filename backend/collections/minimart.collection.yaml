  - name: Payment
    meta:
      id: fld_payment
      sortKey: -2500000000000
      description: |
        Payment processing for orders. Requires an Idempotency-Key header for
        POST /v1/payments. The fake provider approves by default; specific
        amounts can trigger decline (PAYMENT_FAKE_DECLINE_AMOUNT_CENTS) or
        timeout (PAYMENT_FAKE_TIMEOUT_AMOUNT_CENTS).
    children:
      - name: Create Payment
        meta:
          id: req_create_payment
          sortKey: -2500000000001
          description: |
            Creates and processes a payment for an order. The Idempotency-Key
            header is required; a retry with the same key and parameters returns
            the original payment, while the same key with different parameters
            is a conflict (409). Responds 201 with the payment in `data`.
            Seeds payment_id.
        url: "{{ _.base_url }}/v1/payments"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
          - name: Idempotency-Key
            value: "{{ _.idempotency_key }}"
        body:
          mimeType: application/json
          text: |-
            {
              "order_id": "{{ _.order_id }}",
              "user_id": "{{ _.user_id }}",
              "amount_cents": 200,
              "currency": "USD",
              "method": "card"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('create payment returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string').that.has.lengthOf(26).and.match(/^[A-Z2-7]+$/);
              insomnia.expect(body.data.order_id).to.eql(insomnia.environment.get('order_id'));
              insomnia.expect(body.data.user_id).to.eql(insomnia.environment.get('user_id'));
              insomnia.expect(body.data.amount_cents).to.eql(200);
              insomnia.expect(body.data.currency).to.eql('USD');
              insomnia.expect(body.data.method).to.eql('card');
              insomnia.expect(body.data.status).to.be.oneOf(['pending', 'succeeded', 'failed', 'unknown', 'refunded']);
            });
            if (insomnia.response.status === 201) {
              insomnia.environment.set('payment_id', body.data.id);
            }
      - name: Get Payment
        meta:
          id: req_get_payment
          sortKey: -2500000000002
          description: |
            Fetches a payment by id. Responds 200 with the payment in `data`.
            404 when the payment does not exist.
        url: "{{ _.base_url }}/v1/payments/{{ _.payment_id }}"
