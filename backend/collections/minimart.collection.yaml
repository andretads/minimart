      - name: Get Showcase Product (not found)
        meta:
          id: req_get_showcase_product_not_found
          sortKey: -3800000000004
          description: |
            Fetches a showcase product with an invalid ID. Responds 404.
        url: "{{ _.base_url }}/v1/showcase/products/invalid-id"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get showcase product not found returns 404', () => {
              insomnia.expect(insomnia.response.status).to.eql(404);
              insomnia.expect(body.success).to.eql(false);
              insomnia.expect(body.error.message).to.eql('produto não encontrado');
            });
  - name: Shipping
    meta:
      id: fld_shipping
      sortKey: -3400000000000
      description: |
        Shipping quotes, shipments and tracking. A quote snapshots the
        delivery address and the shipping cost for one method; the cart
        checkout consumes it and stores the snapshot on the order. A shipment
        is created by the worker when the order is paid, so the shipment
        requests need a paid order (Payment > Create Payment) and a running
        worker.
    children:
      - name: List Shipping Methods
        meta:
          id: req_list_shipping_methods
          sortKey: -3400000000001
          description: |
            Lists the active shipping methods. Responds 200 with the methods
            in `data` (id, name, description, estimated_min_days,
            estimated_max_days). Seeds shipping_method_id.
        url: "{{ _.base_url }}/v1/shipping/methods"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list shipping methods returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
              insomnia.expect(body.data.every(m => m.active)).to.eql(true);
            });
            if (insomnia.response.status === 200 && body.data.length > 0) {
              insomnia.environment.set('shipping_method_id', body.data[0].id);
            }
      - name: Create Shipping Quote
        meta:
          id: req_create_shipping_quote
          sortKey: -3400000000002
          description: |
            Quotes a shipping method for one of the caller's addresses. The
            quote snapshots the destination and the shipping cost, and is what
            the cart checkout turns into the order's shipping snapshot.
            `subtotal_cents` is the cart total the customer is shopping with:
            a subtotal at the rate's free threshold makes the quote free. It is
            advisory - the cart checkout re-prices the quote with the subtotal
            it computed, so the amount charged never depends on this number.
            The Idempotency-Key header is required (400 when missing) and makes
            the call safe to retry: the same key returns the same quote, while
            the same key with different parameters is a conflict (409).
            Responds 201 with the quote in `data`. 400 for an unknown method
            or address, 404 when the address does not belong to the caller.
            Seeds shipping_quote_id.
        url: "{{ _.base_url }}/v1/shipping/quotes"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
          - name: Idempotency-Key
            value: "{{ _.idempotency_key }}"
        body:
          mimeType: application/json
          text: |-
            {
              "method_id": "{{ _.shipping_method_id }}",
              "address_id": "{{ _.address_id }}",
              "subtotal_cents": {{ _.cart_subtotal_cents }}
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('create shipping quote returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string');
              insomnia.expect(body.data.status).to.eql('active');
              insomnia.expect(body.data.shipping_cost_cents).to.be.a('number');
              insomnia.expect(body.data.subtotal_cents).to.be.a('number');
              insomnia.expect(body.data.free_threshold_cents).to.be.a('number');
              insomnia.expect(body.data.destination_snapshot).to.be.an('object');
            });
            if (insomnia.response.status === 201) {
              insomnia.environment.set('shipping_quote_id', body.data.id);
            }
      - name: Get Shipment Tracking Events
        meta:
          id: req_get_shipment_tracking_events
          sortKey: -3400000000003
          description: |
            Returns the tracking history of a shipment, oldest first. Responds
            200 with the events in `data` (id, shipment_id, status,
            description, location, occurred_at). 404 when the shipment does
            not exist, 403 when it belongs to another user.
        url: "{{ _.base_url }}/v1/shipping/shipments/{{ _.shipment_id }}/events"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get shipment tracking events returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
            });
  - name: Cart
    meta:
      id: fld_cart
      sortKey: -3250000000000
      description: |
        Shopping cart. The cart is a MongoDB document per customer, addressed by
        the authenticated user (access-token cookie). Requires a product to exist
        (Catalog > Create Product), since names and prices are resolved
        server-side. Checkout places an order through the order domain and
        requires an Idempotency-Key header; it consumes the cart, and the next
        request starts a fresh one.
    children:
      - name: Get Cart
        meta:
          id: req_get_cart
          sortKey: -3250000000001
          description: |
            Returns the authenticated user's cart, creating one when none
            exists. Responds 200 with the cart in `data` (id, customer_id,
            status, items, estimated_total_cents, timestamps). Seeds cart_id.
        url: "{{ _.base_url }}/v1/cart"
        method: GET
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('get cart returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.id).to.be.a('string').that.has.lengthOf(26).and.match(/^[A-Z2-7]+$/);
              insomnia.expect(body.data.status).to.eql('active');
              insomnia.expect(body.data.items).to.be.an('array');
              insomnia.expect(body.data.estimated_total_cents).to.be.a('number');
            });
            if (insomnia.response.status === 200) {
              insomnia.environment.set('cart_id', body.data.id);
              insomnia.environment.set('cart_subtotal_cents', body.data.estimated_total_cents);
            }
      - name: Add Item
        meta:
          id: req_add_cart_item
          sortKey: -3250000000002
          description: |
            Adds a product to the cart. When the product is already in the cart
            its quantity is incremented instead. Responds 200 with the updated
            cart in `data`. 400 for an invalid quantity or an unknown product,
            404 when the product does not exist in the catalog.
        url: "{{ _.base_url }}/v1/cart/items"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "product_id": "{{ _.product_id }}",
              "quantity": 2
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('add cart item returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.items).to.have.lengthOf(1);
              insomnia.expect(body.data.items[0].product_id).to.eql(insomnia.environment.get('product_id'));
              insomnia.expect(body.data.items[0].quantity).to.eql(2);
              insomnia.expect(body.data.items[0].line_total_cents).to.eql(body.data.items[0].unit_price_snapshot_cents * 2);
            });
      - name: Update Item Quantity
        meta:
          id: req_update_cart_item
          sortKey: -3250000000003
          description: |
            Sets the quantity of a product already in the cart. Responds 200 with
            the updated cart in `data`. 400 for a quantity below 1, 404 when the
            product is not in the cart.
        url: "{{ _.base_url }}/v1/cart/items/{{ _.product_id }}"
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "quantity": 3
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('update cart item returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.items).to.have.lengthOf(1);
              insomnia.expect(body.data.items[0].quantity).to.eql(3);
            });
      - name: Checkout Cart
        meta:
          id: req_checkout_cart
          sortKey: -3250000000004
          description: |
            Turns the cart into an order. The Idempotency-Key header is
            required (400 when missing) and makes the call safe to retry: the
            same key returns the same order. A shipping quote and an address
            are required too: the quote's destination becomes the order's
            shipping snapshot, which the shipping domain turns into a shipment
            when the order is paid. The shipping cost is re-priced here
            against the cart's own subtotal, so the rate's free shipping
            threshold applies to what the cart actually holds. Responds 201
            with the order in `data` (order_id, user_id, customer_id, status,
            total_cents). 400 for an empty cart or a missing quote, 409 when
            the cart is not active or the order conflicts. Seeds
            cart_order_id.
        url: "{{ _.base_url }}/v1/cart/checkout"
        method: POST
        headers:
          - name: Idempotency-Key
            value: "{{ _.idempotency_key }}"
        body:
          mimeType: application/json
          text: |-
            {
              "shipping_quote_id": "{{ _.shipping_quote_id }}",
              "address_id": "{{ _.address_id }}"
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('checkout cart returns 201', () => {
              insomnia.expect(insomnia.response.status).to.eql(201);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.order_id).to.be.a('string');
              insomnia.expect(body.data.user_id).to.eql(insomnia.environment.get('user_id'));
              insomnia.expect(body.data.status).to.eql('placed');
              insomnia.expect(body.data.total_cents).to.be.a('number');
            });
            if (insomnia.response.status === 201) {
              insomnia.environment.set('cart_order_id', body.data.order_id);
            }
      - name: Add Item (after checkout)
        meta:
          id: req_add_cart_item_after_checkout
          sortKey: -3250000000005
          description: |
            Checkout consumes the cart, so the next request starts a fresh one.
            Adding an item creates it again. Responds 200 with the new cart in
            `data`.
        url: "{{ _.base_url }}/v1/cart/items"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "product_id": "{{ _.product_id }}",
              "quantity": 1
            }
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('add cart item after checkout returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.status).to.eql('active');
              insomnia.expect(body.data.items).to.have.lengthOf(1);
            });
      - name: Remove Item
        meta:
          id: req_remove_cart_item
          sortKey: -3250000000006
          description: |
            Removes a product from the cart. Responds 200 with the updated cart
            in `data`. 404 when the product is not in the cart.
        url: "{{ _.base_url }}/v1/cart/items/{{ _.product_id }}"
        method: DELETE
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('remove cart item returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data.items).to.have.lengthOf(0);
            });
      - name: Clear Cart
        meta:
          id: req_clear_cart
          sortKey: -3250000000007
          description: |
            Removes every item from the cart; the cart itself stays active.
            Responds 204 with an empty body.
        url: "{{ _.base_url }}/v1/cart"
        method: DELETE
        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            insomnia.test('clear cart returns 204', () => {
              insomnia.expect(insomnia.response.status).to.eql(204);
            });
  - name: Order
    meta:
      id: fld_order
      sortKey: -3000000000000
      description: |
        Placing and cancelling orders. Requires a product to exist (Catalog >
        Create Product), since prices are resolved server-side from the catalog.
        Run requests in order: Place Order seeds order_id.
    children:
      - name: Place Order
        meta:
          id: req_place_order
          sortKey: -3000000000001
          description: |
            Places an order. Prices are not sent; they are resolved from the
            catalog. Responds 201 with the order in `data` (items include name,
            unit_price_cents and line_total_cents). A placed order also carries
            `auto_cancel_at`. 400 for an empty item list, zero quantity or an
            unknown product. Seeds order_id.
        url: "{{ _.base_url }}/v1/orders"
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "user_id": "{{ _.user_id }}",
              "items": [
                {
                  "product_id": "{{ _.product_id }}",
                  "quantity": 2
                }
              ]
            }
        scripts:
