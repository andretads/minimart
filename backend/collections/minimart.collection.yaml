        headers:
          - name: Accept
            value: application/json
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.test('list notifications returns 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
              insomnia.expect(body.success).to.eql(true);
              insomnia.expect(body.data).to.be.an('array');
            });
            if (insomnia.response.status === 200 && Array.isArray(body.data) && body.data.length > 0) {
              insomnia.environment.set('notification_id', body.data[0].id);
