            });
      - name: Delete Category (stale If-Match, 409)
        meta:
          id: req_delete_category_conflict
          sortKey: -3900000000010
          description: |
            Attempts to delete a category with a stale If-Match version. Responds 409.
        url: "{{ _.base_url }}/v1/categories/{{ _.category_id }}"
        method: DELETE
        headers:
          - name: If-Match
            value: '"99"'
        scripts:
          afterResponse: |-
