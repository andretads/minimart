version: "2"

# Each domain gets a separate reader and writer package, generated from that
# domain's queries.sql. The schema source of truth is the dbmate migrations, so
# sqlc and the database can never drift. Regenerate with `sqlc generate`.
# Never hand-edit the generated *.sql.go / models.go / db.go files.
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/catalog/infrastructure/postgres/reader/queries.sql"
    gen:
      go: &go
        package: "reader"
        out: "internal/catalog/infrastructure/postgres/reader"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/catalog/infrastructure/postgres/writer/queries.sql"
    gen:
      go:
        <<: *go
        package: "writer"
        out: "internal/catalog/infrastructure/postgres/writer"

  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/order/infrastructure/postgres/reader/queries.sql"
    gen:
      go:
        <<: *go
        package: "reader"
        out: "internal/order/infrastructure/postgres/reader"

  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/order/infrastructure/postgres/writer/queries.sql"
    gen:
      go:
        <<: *go
        package: "writer"
        out: "internal/order/infrastructure/postgres/writer"

  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/payment/infrastructure/postgres/reader/queries.sql"
    gen:
      go:
        <<: *go
        package: "reader"
        out: "internal/payment/infrastructure/postgres/reader"

  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/payment/infrastructure/postgres/writer/queries.sql"
    gen:
      go:
        <<: *go
        package: "writer"
        out: "internal/payment/infrastructure/postgres/writer"

  # The transactional outbox is shared infrastructure (pkg/outbox), so its
  # generated queries live next to the reusable Store adapter rather than in a
  # domain package.
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "pkg/outbox/postgres/queries.sql"
    gen:
      go:
        <<: *go
        package: "postgres"
        out: "pkg/outbox/postgres"
  - name: customer_reader
    schema: "db/migrations"
    queries: "internal/customer/infrastructure/postgres/reader/queries.sql"
    engine: "postgresql"
    gen:
