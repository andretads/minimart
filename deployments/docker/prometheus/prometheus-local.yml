global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

# Local mode: the MiniMart binary runs on your host (make -C backend server / make -C backend worker)
# while Prometheus runs in Docker, reaching the host through host.docker.internal.
scrape_configs:
  # The HTTP server exposes /metrics on SERVER_HTTP_ADDR (default :8080): HTTP golden
  # signals, business counters, Kafka publish metrics, and DB pool gauges.
  - job_name: 'minimart-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']

  # The worker exposes /metrics on WORKER_HTTP_ADDR (default :8081): Kafka consume
  # metrics and the same DB pool gauges. The target is down unless `make -C backend worker`
  # is running.
  - job_name: 'minimart-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8081']
